<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LZ Sports - Loja</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>

<body>

  <!-- TOPBAR -->
  <header class="bg-black py-2">
    <div class="container-fluid px-3">
      <div class="d-flex align-items-center justify-content-between gap-3">

        <!-- Logo -->
        <div class="d-flex align-items-center">
          <img
            src="{{ url_for('static', filename='img/brand/logo-topbar.png') }}"
            alt="LZ Sports"
            style="height:44px; width:auto;"
          />
        </div>

        <!-- Busca -->
        <div class="flex-grow-1 d-flex justify-content-center">
          <div class="input-group" style="max-width:520px;">
            <span class="input-group-text bg-white border-0 rounded-start-pill">
              <i class="bi bi-search"></i>
            </span>
            <input class="form-control border-0 rounded-end-pill" type="text" placeholder="Buscar">
          </div>
        </div>

        <!-- Usuário + Carrinho -->
        <div class="d-flex align-items-center gap-3 text-white">
          <div class="d-flex align-items-center gap-2 fw-bold">
            <i class="bi bi-person-circle fs-4"></i>
            <span>Luiz</span>
          </div>

        <button class="btn btn-light rounded-pill px-3 topbar-cart-btn" type="button" aria-label="Carrinho">
            <i class="bi bi-cart3 fs-5"></i>
        </button>
        </div>

      </div>
    </div>
  </header>

  <!-- BANNER -->
  <section class="hero">
    <img class="hero__img" src="{{ url_for('static', filename='img/banners/home-banner.png') }}" alt="Banner LZ Sports">
  </section>

  <!-- PRODUTOS -->
  <main class="container py-4">
    <div class="row g-5 justify-content-center">

      <!-- CARD 1 -->
<div class="col-12 col-md-6 col-xl-4 d-flex justify-content-center">
  <a href="{{ url_for('main.produto_detalhe') }}" class="product-card text-decoration-none">
    <div class="product-card__media">
      <img class="product-card__img"
          src="{{ url_for('static', filename='img/products/sao-paulo-24-25.png') }}"
          alt="São Paulo 24/25">
    </div>

    <div class="product-card__info">
      <div>
        <div class="product-card__title">São Paulo</div>
        <div class="product-card__sub">24/25</div>
      </div>

      <!-- evita navegar ao clicar no carrinho -->
      <button class="btn p-0 product-card__btn" type="button"
              onclick="event.preventDefault(); event.stopPropagation();">
        <i class="bi bi-cart3 product-cart-icon"></i>
      </button>
    </div>
  </a>
</div>

      <!-- CARD 2 -->
      <div class="col-12 col-md-6 col-xl-4 d-flex justify-content-center">
        <div class="product-card">
          <div class="product-card__media">
            <img class="product-card__img" src="{{ url_for('static', filename='img/products/corinthians-24-25.png') }}" alt="Corinthians 24/25">
          </div>

          <div class="product-card__info">
            <div>
              <div class="product-card__title">Corinthians</div>
              <div class="product-card__sub">24/25</div>
            </div>

            <button class="btn p-0" type="button" aria-label="Adicionar ao carrinho">
              <i class="bi bi-cart3 product-cart-icon"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="col-12 col-md-6 col-xl-4 d-flex justify-content-center">
        <div class="product-card">
          <div class="product-card__media">
            <img class="product-card__img" src="{{ url_for('static', filename='img/products/palmeiras-24-25.png') }}" alt="Palmeiras 24/25">
          </div>

          <div class="product-card__info">
            <div>
              <div class="product-card__title">Palmeiras</div>
              <div class="product-card__sub">24/25</div>
            </div>

            <button class="btn p-0" type="button" aria-label="Adicionar ao carrinho">
              <i class="bi bi-cart3 product-cart-icon"></i>
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
